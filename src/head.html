<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1534e6">
<meta name="description" content="Slanger: read a slang definition, guess the word, sink as deep as your guess deserves. One in a slanger.">
<title>Slanger</title>
<style>
/*
IDEA    a dictionary entry sinking through deep water. Every guess is a depth reading.
COLOUR  vivid cobalt at the surface to ultramarine black in the trench. The entry is a cool paper slip.
        Buoy-flare orange marks only the target: the depth marker, the Slanger, low oxygen.
TYPE    Cardo for words (headwords, definitions, examples). Fira Sans for readouts and controls.
        Light weights, sentence case, tabular figures. Nothing rounded, nothing glowing.
MOTION  the sea moves; a win is a sonar ping and a headword written in italic. One moment at a time.
*/
/*__FONTS__*/
:root{
  color-scheme:dark;
  --ink:#eef1ff; --mute:#b9c2ff; --line:rgba(214,222,255,.26); --line2:rgba(214,222,255,.13);
  --night:rgba(3,7,48,.9);
  --paper:#f4f6ff; --pink:#0b1680; --pmute:#4a56a6; --pline:rgba(11,22,128,.17);
  --flare:#ff5a1f; --flareInk:#b83000;
  --z0:#dfe3ff; --z1:#ffe14d; --z2:#ffa53a; --z3:#35e8a0; --z4:#49d0ff; --z5:#c99bff; --z6:#ff5a1f;
  --serif:"Cardo","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --navH:58px; --barH:58px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:#030838}
body{color:var(--ink);font:400 16px/1.55 var(--sans);min-height:100dvh;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-kerning:normal}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
[tabindex="-1"]:focus{outline:none}
.num{font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}

/* ---------- the sea ---------- */
#sea{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.water{position:absolute;inset:0;background:linear-gradient(180deg,#2f6dff 0%,#2150ff 7%,#173de8 16%,#1130c4 28%,#0c22a0 42%,#091a7e 56%,#06115c 70%,#040a3d 83%,#020523 93%,#01020f 100%);background-size:100% 800%;background-position:50% 0%}
#fx{position:absolute;inset:0;width:100%;height:100%}
.caustic{position:absolute;inset:-30% -30% 50% -30%;mix-blend-mode:soft-light;opacity:.3;background:
 radial-gradient(80px 22px at 20% 30%,rgba(255,255,255,.7),transparent 70%),
 radial-gradient(110px 26px at 60% 18%,rgba(255,255,255,.55),transparent 70%),
 radial-gradient(64px 18px at 82% 44%,rgba(255,255,255,.6),transparent 70%),
 radial-gradient(120px 30px at 38% 62%,rgba(255,255,255,.5),transparent 70%);
 background-size:380px 230px;animation:caustic 9s ease-in-out infinite alternate}
@keyframes caustic{to{background-position:70px 40px,-50px 30px,40px -20px,-70px 20px;transform:skewX(5deg) scaleY(1.08)}}
.vignette{position:absolute;inset:0;background:radial-gradient(130% 95% at 50% 30%,transparent 50%,rgba(1,2,20,.55) 100%)}
.floor{position:absolute;left:-10%;right:-10%;bottom:-34vh;height:70vh;background:radial-gradient(50% 50% at 50% 50%,rgba(255,90,31,.32),rgba(255,90,31,.06) 45%,transparent 70%);opacity:0}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;min-height:100dvh}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--navH) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(3,8,56,.94);border-top:1px solid var(--line2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);text-decoration:none;font-size:11.5px;letter-spacing:.01em;min-height:44px}
.nav a svg{width:21px;height:21px}
.nav a[aria-current=page]{color:var(--ink)}
.nav a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--flare)}
.nav .brand,.nav .dsk,.nav hr{display:none}
main{padding:0 0 calc(var(--navH) + 36px + env(safe-area-inset-bottom))}
main:focus{outline:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
body.playing .nav{display:none}
body.playing main{padding-bottom:40px}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:212px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:0;padding:28px 0 24px;border-top:0;border-right:1px solid var(--line2);bottom:auto;overflow-y:auto;background:rgba(3,8,56,.7)}
  .nav .brand{display:block;font:italic 400 34px/1 var(--serif);color:var(--ink);text-decoration:none;padding:0 24px 26px;letter-spacing:-.01em}
  .nav .dsk{display:flex}
  .nav hr{display:block;border:0;border-top:1px solid var(--line2);margin:12px 24px}
  .nav a{flex-direction:row;justify-content:flex-start;gap:12px;padding:8px 24px;font-size:15px;min-height:40px;letter-spacing:0}
  .nav a svg{display:none}
  .nav a:hover{color:var(--ink)}
  .nav a[aria-current=page]::before{top:8px;bottom:8px;left:0;right:auto;width:2px;height:auto}
  main{padding-bottom:64px}
  body.playing .nav{display:flex}
}

/* ---------- shared pieces ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:3px;border:1px solid var(--line);background:transparent;font-weight:400;font-size:16px;text-decoration:none;color:var(--ink);transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:active{background:rgba(255,255,255,.08)}
.btn.primary{background:var(--paper);color:var(--pink);border-color:var(--paper);font-weight:500}
.btn.primary:hover{background:#fff;border-color:#fff}
.btn.danger{border-color:var(--flare);color:#ffd4c4}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{font-family:var(--sans);font-style:normal;display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--line);border-radius:3px;font-size:13.5px}
.zc{font-family:var(--sans);font-style:normal;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.zc::before{content:"";width:12px;height:3px;background:var(--zc)}
.z0{--zc:var(--z0)}.z1{--zc:var(--z1)}.z2{--zc:var(--z2)}.z3{--zc:var(--z3)}.z4{--zc:var(--z4)}.z5{--zc:var(--z5)}.z6{--zc:var(--z6)}
.kicker{font-size:14px;color:var(--mute);margin:0 0 8px}
.msgline{min-height:22px;font-size:14.5px;color:var(--mute);margin:0}
.msgline.warn{color:#ffd0bd}
.sect{font:400 26px/1.2 var(--serif);margin:56px 0 4px}
.lede{max-width:52ch;font-size:17px;margin:12px 0 0}

/* paper: the dictionary slip */
.paper{background:var(--paper);color:var(--pink);border-radius:2px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 40px 70px -36px rgba(0,2,30,.85),0 6px 18px -8px rgba(0,2,30,.45)}
.paper .kicker{color:var(--pmute)}
.paper .btn{color:var(--pink);border-color:var(--pline)}
.paper .btn:hover{border-color:var(--pink)}
.paper .btn.primary{background:var(--pink);color:var(--paper);border-color:var(--pink)}
.paper .btn.primary:hover{background:#06104f}
.paper .chip{border-color:var(--pline);color:var(--pink)}
.paper .zc{color:var(--pmute)}
.paper :focus-visible{outline-color:var(--pink)}

/* ---------- home ---------- */
.home{padding-top:clamp(36px,9vh,96px)}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 64px}
.entry .hw{font:400 clamp(76px,23vw,150px)/.88 var(--serif);letter-spacing:-.035em;margin:0 0 0 -.04em}
.entry .pr{font:400 18px/1.4 var(--serif);color:var(--mute);margin:18px 0 0}
.entry .pr i{color:var(--ink)}
.senses{margin:20px 0 0;padding:0 0 0 1.4em;font:400 clamp(19px,4.8vw,22px)/1.5 var(--serif);max-width:34ch}
.senses li{padding-left:.3em;margin-top:6px}
.senses li::marker{font-family:var(--sans);font-size:.7em;color:var(--mute)}
.senses i{color:var(--mute)}
.cta{margin-top:34px}
.cta .btn.primary{min-height:56px;padding:0 28px;font-size:17px}
.cta .meta{margin:14px 0 0;font-size:14.5px;color:var(--mute)}
.countdown{font-size:14.5px;color:var(--mute);margin:8px 0 0}
.modelist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line2)}
.modelist li{border-bottom:1px solid var(--line2)}
.modelist a,.modelist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:baseline;width:100%;padding:16px 0;text-decoration:none;color:var(--ink);background:none;border:0;text-align:left}
.modelist .n{font:400 22px/1.2 var(--serif);transition:transform .3s var(--ease)}
.modelist .b{font-size:13.5px;color:var(--mute);text-align:right}
.modelist .d{grid-column:1/-1;font-size:14.5px;color:var(--mute);max-width:48ch}
.modelist a:hover .n,.modelist button:hover .n{transform:translateX(6px)}
@media(min-width:1100px){
  .home .wrap,.home{max-width:1080px}
  .homegrid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}
  .homegrid .sect{margin-top:14px}
}

/* ---------- play ---------- */
.bar{position:sticky;top:0;z-index:10;height:var(--barH);display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(3,8,56,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bar .back{flex:none;width:40px;height:40px;margin-left:-6px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.bar .back svg{width:20px;height:20px}
.bar h1{font:400 18px/1.15 var(--serif);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font:400 12.5px/1.3 var(--sans);color:var(--mute)}
.bar .tot{font:300 22px/1 var(--sans);text-align:right;white-space:nowrap}
.bar .tot small{display:block;font:400 11.5px/1.4 var(--sans);color:var(--mute)}
.bar .btn{min-height:36px;padding:0 12px;font-size:14px}
.oxy{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line2)}
.oxy i{display:block;height:100%;width:100%;transform-origin:left;background:var(--ink);transition:transform .12s linear}
.oxy.low i{background:var(--flare);animation:oxlow .5s ease-in-out infinite alternate}
@keyframes oxlow{to{opacity:.45}}
.play{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:22px 14px 0 10px;max-width:880px;margin:0 auto}
@media(min-width:600px){.play{grid-template-columns:112px minmax(0,1fr);gap:28px;padding:30px 24px 0}}
.gauge{position:sticky;top:calc(var(--barH) + 22px);height:calc(100dvh - var(--barH) - 60px);max-height:720px;min-height:380px}
.scale{position:relative;height:100%;border-left:1px solid var(--line)}
.fill{position:absolute;left:-1px;top:0;width:1px;height:0;background:var(--ink);transition:height 1.2s var(--ease)}
.seg{position:absolute;left:0;right:0;padding:4px 0 0 12px}
.seg::before{content:"";position:absolute;left:-2px;top:0;bottom:0;width:3px;background:var(--zc);opacity:.9}
.seg::after{content:"";position:absolute;left:-2px;top:0;width:8px;height:1px;background:var(--line)}
.seg b{display:block;font-size:12.5px;line-height:1.2;font-weight:400;color:var(--ink)}
.seg span{display:block;font-size:11.5px;line-height:1.3;color:var(--mute)}
@media(max-width:599px){.seg b,.seg span{display:none}}
.diver{position:absolute;left:-10px;right:0;height:0;top:0;transition:top 1.2s var(--ease);z-index:2}
.diver svg{position:absolute;left:0;top:-7px;width:14px;height:14px}
.diver::after{content:"";position:absolute;left:12px;right:0;top:-1px;height:2px;background:var(--flare)}
.diver.sinking svg{animation:ping .9s var(--ease)}
@keyframes ping{40%{transform:translateX(5px)}}
.tick{position:absolute;left:-6px;width:11px;height:1px;background:var(--zc);transform:translateY(-.5px)}
.col{display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.card{padding:26px 24px 24px;transform-style:preserve-3d}
@media(min-width:600px){.card{padding:34px 36px 32px}}
.card.out{transition:transform .28s ease-in,opacity .28s;transform:translateY(-14px);opacity:0}
.card.in{animation:cardin .55s var(--ease)}
@keyframes cardin{from{transform:translateY(18px);opacity:0}}
.card.slide{animation:cardin .5s var(--ease)}
.def{font:400 clamp(21px,5.4vw,27px)/1.42 var(--serif);margin:0;letter-spacing:-.005em}
.ex{margin:16px 0 0;font:italic 400 clamp(17px,4.4vw,19px)/1.55 var(--serif);color:var(--pmute)}
.mask{display:inline-block;min-width:3.2em;font-style:normal;font-family:var(--sans);font-size:.82em;letter-spacing:.18em;color:var(--pink);border-bottom:1.5px solid var(--pink);line-height:1.1;text-align:center}
.mask.blank{color:transparent}
.hintout{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
form.guess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;border-bottom:1px solid var(--ink);margin-top:6px}
.guess input{height:62px;border:0;background:transparent;padding:0 2px;font:400 clamp(24px,6vw,30px)/1 var(--serif);border-radius:0}
.guess input::placeholder{color:var(--mute);opacity:.75;font-style:italic}
.guess input:focus{outline:none}
form.guess:focus-within{border-bottom-color:var(--flare);box-shadow:0 1px 0 var(--flare)}
.guess input.ac{color:var(--z2);animation:acfx .6s var(--ease)}
@keyframes acfx{0%{letter-spacing:.3em;opacity:.25}100%{letter-spacing:0;opacity:1}}
.guess .btn{align-self:center;min-height:44px;padding:0 20px}
.airrow{display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mute)}
.air{display:flex;gap:4px;align-items:center}
.pip{width:3px;height:14px;background:var(--ink);transition:opacity .4s,transform .4s var(--ease)}
.pip.used{opacity:.22;transform:scaleY(.45)}
.o2{display:inline-flex;gap:6px;align-items:baseline}
.o2 .t{color:var(--ink);font-size:15px}
.o2.low .t{color:var(--flare)}
.hinttog{margin-left:auto;background:none;border:0;padding:8px 0;color:var(--ink);font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.hinttog:hover{text-decoration-color:var(--ink)}
.hinttog svg{width:12px;height:12px;transition:transform .25s var(--ease)}
.hinttog[aria-expanded=true] svg{transform:rotate(180deg)}
.skipbtn{justify-self:start;align-self:flex-start}
.result{display:none;border-left:3px solid var(--zc,var(--ink));padding:2px 0 2px 14px}
.result.show{display:block;animation:cardin .45s var(--ease)}
.result .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.result .m{font:300 34px/1 var(--sans)}
.result p{margin:6px 0 0;color:var(--mute);font-size:14.5px}
.result p q{font-family:var(--serif);font-style:italic;font-size:1.12em;color:var(--ink);quotes:none;margin-right:.3em}
.cue{font-size:13.5px;color:var(--mute)}
.cue.deeper{color:var(--z3)}
.hints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line2)}
@media(min-width:600px){.hints{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hint{min-height:56px;border:0;border-bottom:1px solid var(--line2);background:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:8px 10px 8px 0;text-align:left}
.hint b{font-weight:400;font-size:14.5px}
.hint span{font-size:12.5px;color:var(--mute)}
.hint:hover:not([disabled]) b{text-decoration:underline;text-underline-offset:4px}
.hint[aria-pressed=true]{opacity:.45}
.loghead{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.loghead h2{font:400 19px/1 var(--serif)}
.loghead .airlab{font-size:13px;color:var(--mute)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:12px 0 12px 14px;border-bottom:1px solid var(--line2);position:relative;animation:cardin .45s var(--ease)}
.log li::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--zc)}
.log .w{font:400 21px/1.2 var(--serif);overflow-wrap:anywhere}
.log .w s{color:var(--mute);margin-right:8px;font-size:.8em}
.log .d{font:300 18px/1 var(--sans);text-align:right}
.log .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:13px;color:var(--mute)}
.gate{padding:20px 0 6px}
.gate .who{font:italic 400 clamp(48px,14vw,84px)/1 var(--serif);margin:6px 0 14px;overflow-wrap:anywhere}
.gate p{color:var(--pmute);max-width:40ch}
.gate .btn{margin-top:10px}

/* reveal */
.reveal .term{font:400 clamp(48px,14vw,84px)/.95 var(--serif);letter-spacing:-.03em;margin:0 0 6px;overflow-wrap:normal;word-break:keep-all}
.reveal .pos{color:var(--pmute);font:italic 400 18px/1.3 var(--serif);margin:0 0 16px}
.reveal .def{font-size:clamp(19px,4.8vw,23px)}
.reveal mark{background:none;color:var(--pink);font-style:italic;border-bottom:1.5px solid var(--flare)}
.badge{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:15px;font-weight:500;color:var(--pink)}
.badge::before{content:"";width:18px;height:2px;background:currentColor}
.badge.sl{color:var(--flareInk)}
.badge.ac{color:#8a5200}
.badge.out{color:var(--pmute)}
.tally{display:grid;grid-template-columns:auto 1fr;gap:0;margin:14px 0 0;font-size:15px}
.tally dt,.tally dd{padding:7px 0;border-bottom:1px solid var(--pline)}
.tally dt{color:var(--pmute)}
.tally dd{margin:0;text-align:right}
.scoreline{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-top:10px}
.scoreline span{color:var(--pmute);font-size:15px}
.scoreline b{font:300 clamp(36px,10vw,48px)/1 var(--sans);letter-spacing:-.01em}
.next{margin-top:22px;width:100%}

/* results */
.sum{padding-top:28px}
.sum > .btn.small{margin-left:-14px;border-color:transparent}
.totalbig{font:300 clamp(64px,19vw,132px)/.92 var(--sans);letter-spacing:-.035em;margin:10px 0 0}
.winner{font:italic 400 clamp(60px,17vw,120px)/.92 var(--serif);letter-spacing:-.02em;margin:10px 0 0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin:28px 0}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:12px 0;border-top:1px solid var(--line)}
.stat b{display:block;font:300 28px/1.15 var(--sans)}
.stat span{font-size:13.5px;color:var(--mute)}
.share{padding:22px 22px 20px;margin-top:8px}
.share pre{margin:0 0 16px;font:400 17px/1.5 var(--sans);white-space:pre-wrap}
.share textarea{width:100%;min-height:150px;margin-top:12px;border-radius:2px;background:#fff;color:var(--pink);border:1px solid var(--pink);padding:10px;font:15px/1.5 var(--sans)}
.share .msgline{color:var(--pmute);margin-top:10px}
.terms{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.terms li{padding:18px 0;border-bottom:1px solid var(--line2)}
.terms h3{font:400 26px/1.15 var(--serif);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.terms p{margin:6px 0 0;color:var(--mute);font-size:14.5px}
.terms p.d{font:400 17px/1.5 var(--serif);color:var(--ink);max-width:56ch}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* pages */
.page{padding-top:40px}
.page h1{font:400 clamp(46px,12vw,72px)/1 var(--serif);letter-spacing:-.025em}
.page .intro{margin:16px 0 0;max-width:56ch;font-size:17px}
.block{margin-top:44px}
.block h2{font:400 25px/1.2 var(--serif);margin-bottom:12px}
.block p,.block li{color:var(--ink)}
.block > p{max-width:60ch}
.block ul{padding-left:1.1em;max-width:60ch}
.block li{margin-top:6px}
.block li::marker{color:var(--mute)}
.steps{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:0 28px;margin:30px 0 0;padding:0}
.steps li{counter-increment:s;padding:16px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);display:block;font:italic 400 30px/1 var(--serif);color:var(--mute);margin-bottom:10px}
.steps h3{font:400 22px/1.2 var(--serif);margin:0 0 4px}
.steps p{margin:0;color:var(--mute);font-size:15px}
.ladder{list-style:none;margin:0;padding:0;border-top:1px solid var(--line2)}
.ladder li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.ladder .sw{width:28px;height:3px;background:var(--zc)}
.ladder b{font:400 19px/1.2 var(--serif)}
.ladder span{color:var(--mute);font-size:14px;text-align:right}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:0 24px;margin-top:6px}
.tiers div{padding:12px 0;border-top:1px solid var(--line2)}
.tiers b{display:block;font:400 19px/1.25 var(--serif);margin-bottom:2px}
.tiers span{font-size:14.5px;color:var(--mute)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line2)}
.opt:first-child{border-top:1px solid var(--line2)}
.opt b{font-weight:400;font-size:17px}
.opt p{margin:2px 0 0;font-size:14px;color:var(--mute);max-width:52ch}
.sw2{flex:none;width:46px;height:26px;border-radius:3px;border:1px solid var(--line);background:transparent;position:relative;padding:0}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:2px;background:var(--mute);transition:transform .25s var(--ease),background .2s}
.sw2[aria-checked=true]{border-color:var(--ink);background:rgba(238,241,255,.12)}
.sw2[aria-checked=true]::after{transform:translateX(20px);background:var(--ink)}
.store{font-size:13.5px;color:var(--mute);margin-top:30px}
.days{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line2)}
.days li{border-bottom:1px solid var(--line2)}
.days a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:baseline;padding:14px 0;text-decoration:none;color:var(--ink)}
.days a:hover b{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.days b{font:400 20px/1.2 var(--serif)}
.days span{font-size:14px;color:var(--mute)}
.days .st{font:300 17px/1 var(--sans);text-align:right;color:var(--mute)}
.days .st.done{color:var(--ink)}
.hist{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.hist .row{display:grid;grid-template-columns:96px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14px;padding:4px 0}
.hist .row b{font:400 16px/1.2 var(--serif)}
.hist .trk{height:14px;position:relative}
.hist .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--zc);min-width:1px;transition:width .8s var(--ease)}
.hist .row span{text-align:right;color:var(--mute)}
.players{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.players .p{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.players input,.field select{height:50px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:0 2px;font:400 21px/1 var(--serif)}
.field select{font:400 16px/1 var(--sans);border:1px solid var(--line);border-radius:3px;padding:0 10px;background:rgba(3,8,56,.6)}
.players input:focus,.field select:focus{outline:none;border-color:var(--flare)}
.players input::placeholder{color:var(--mute);font-style:italic;opacity:.7}
.players .btn{border-color:transparent;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:18px;max-width:240px}
.field label{font-size:14px;color:var(--mute)}
.board{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line)}
.board li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line2)}
.board .rk{font:italic 400 22px/1 var(--serif);color:var(--mute);width:1.4ch}
.board .nm{font:400 24px/1.15 var(--serif);overflow-wrap:anywhere}
.board .sc{font:300 22px/1 var(--sans)}
.board li.win .rk{color:var(--flare)}
.rq{display:flex;flex-direction:column;gap:0;margin-top:20px;border-top:1px solid var(--line2)}
.rq button{position:relative;width:100%;text-align:left;padding:16px 4px 16px 18px;border:0;border-bottom:1px solid var(--line2);background:none;font:400 18px/1.45 var(--serif);min-height:64px;transition:background .2s}
.rq button::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;background:var(--line)}
.rq button:hover:not([disabled]){background:rgba(238,241,255,.06)}
.rq button:hover:not([disabled])::before{background:var(--ink)}
.rq button.right{background:rgba(53,232,160,.12)}
.rq button.right::before{background:var(--z3)}
.rq button.wrong{background:rgba(255,90,31,.12);animation:nope .4s}
.rq button.wrong::before{background:var(--flare)}
.rq button[disabled]{cursor:default}
.rq button[disabled]:not(.right):not(.wrong){opacity:.55}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bigterm{font:400 clamp(52px,15vw,96px)/.95 var(--serif);letter-spacing:-.03em;margin:0 0 6px;overflow-wrap:normal;word-break:keep-all}
.revpos{margin:0;color:var(--pmute);font:italic 400 18px/1.3 var(--serif)}
.revwrap{padding-top:24px;max-width:720px}
.revwrap .oxyline{position:relative;height:3px;margin:22px 0 4px}
.revwrap .oxyline .oxy{position:absolute}
.revwrap .o2{margin-top:8px;font-size:14px;color:var(--mute)}

/* bursts, modal, flash, toast */
#burst{position:fixed;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.wb{position:relative;text-align:center;padding:0 16px;animation:wbout .6s ease-in forwards;animation-delay:var(--hold,1.2s)}
.scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(2,5,40,.86),rgba(2,5,40,.62) 55%,rgba(2,5,40,.3));animation:scrim 1.6s ease forwards}
.scrim.close{background:radial-gradient(circle at 50% 50%,rgba(2,5,40,.9),rgba(2,5,40,.6) 50%,rgba(2,5,40,.2))}
@keyframes scrim{0%{opacity:0}12%{opacity:1}72%{opacity:1}100%{opacity:0}}
html.rm .scrim{opacity:1}
.wb .word{font:italic 400 clamp(64px,19vw,170px)/1 var(--serif);letter-spacing:-.025em;color:var(--ink);max-width:94vw;padding-bottom:.08em}
.wb .w{display:inline-block;white-space:nowrap;margin:0 .12em}
.wb .l{display:inline-block;animation:lin .9s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}
.wb.exact .word,.wb.slanger .word{font-size:clamp(72px,23vw,210px);color:#fff}
.wb .rule{height:2px;width:min(70vw,520px);margin:6px auto 0;background:var(--zc);transform-origin:left;animation:rule .9s .25s var(--ease) both}
.wb.exact .rule,.wb.slanger .rule{background:var(--flare);height:3px}
.wb .kick{font:400 clamp(16px,4.2vw,22px)/1.2 var(--sans);letter-spacing:.01em;color:var(--ink);margin-top:18px;animation:kin .6s .45s both}
.wb.slanger .kick{font:italic 400 clamp(24px,6.4vw,38px)/1.1 var(--serif);color:#fff}
@keyframes lin{0%{opacity:0;transform:translateY(.28em);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes rule{from{transform:scaleX(0)}}
@keyframes kin{from{opacity:0;transform:translateY(10px)}}
@keyframes wbout{to{opacity:0;transform:translateY(-28px);filter:blur(6px)}}
.ring{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax;border-radius:50%;border:1.5px solid var(--zc);animation:ring 1.8s cubic-bezier(.12,.7,.3,1) both;animation-delay:var(--d,0s);opacity:0}
@keyframes ring{0%{transform:scale(.02);opacity:1}100%{transform:scale(1);opacity:0}}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(1,3,30,.72)}
.modal .box{max-width:440px;width:100%;padding:28px}
.modal h2{font:400 28px/1.1 var(--serif)}
.modal p{color:var(--pmute)}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.modal .btn.danger{background:var(--flareInk);border-color:var(--flareInk);color:#fff}
#flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(240,244,255,.55),rgba(120,150,255,.18) 40%,transparent 72%)}
#flash.on{animation:flash 1.4s ease-out forwards}
@keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(var(--navH) + 22px);transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--pink);padding:10px 18px;border-radius:2px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;font-size:15px}
#toast.on{opacity:1}

/* reduced motion + high contrast */
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
html.rm .caustic{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.caustic{display:none}}
html.hc{--line:#fff;--line2:rgba(255,255,255,.6);--mute:#fff;--ink:#fff;--paper:#fff;--pink:#000;--pmute:#000;--pline:#000}
html.hc .water{filter:brightness(.22) saturate(.4)}
html.hc .caustic,html.hc #fx,html.hc .floor{display:none}
html.hc .bar,html.hc .nav{background:#000}
html.hc .paper{box-shadow:none;outline:2px solid #fff}
</style>
</head>
